name: CI

  on:
    # Full workflow runs on pull requests to main and dev
    pull_request:
      branches:
        - main
        - dev

    push:
      branches-ignore:
        - main
        - dev

  jobs:
    lint:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v2
        - name: Install dependencies
          run: npm install
        - name: Run ESLint
          run: npm run lint

    build-and-test:
      if: github.event_name == 'pull_request'
      runs-on: ubuntu-latest
      strategy:
        matrix:
          node-version: [14.x, 16.x]
      steps:
        - uses: actions/checkout@v2
        - name: Use Node.js ${{ matrix.node-version }}
          uses: actions/setup-node@v2
          with:
            node-version: ${{ matrix.node-version }}
        - name: Install dependencies
          run: npm install
        - name: Build project
          run: npm run build
        - name: Run tests
          run: npm run test


    basic-build:
      if: github.event_name == 'push'
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v2
        - name: Install dependencies
          run: npm install
        - name: Build project
          run: npm run build


    ios-build:
      if: github.event_name == 'pull_request'
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '18'
        - name: Install dependencies
          run: npm install
        - name: Setup Ruby
          uses: ruby/setup-ruby@v1
          with:
            ruby-version: '3.2'
        - name: Install CocoaPods dependencies
          working-directory: ios
          run: |
            gem install cocoapods
            pod install --repo-update
        - name: Build iOS
          run: |
            xcodebuild -workspace ios/DripOutApp.xcworkspace \
              -scheme DripOutApp \
              -sdk iphonesimulator \
              -configuration Release \
              -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
              clean build
